name: Build GDC Plugin Manager (Windows .exe + installer)

# Se ruleaza automat cand faci "git push" pe branch-ul main, sau manual
# din tab-ul "Actions" al repo-ului (butonul "Run workflow"). Rezultatul
# (GDCPluginManagerSetup.exe) e apoi urcat AUTOMAT (2026-09-05) pe
# release-ul de la gordasgdc/gdc-plugin-manager (acolo unde traiesc si
# asset-urile Mac, care raman semnate/notarizate manual pe Mac-ul lui
# Cristi) + docs/update.json (sectiunea "windows") e bumpuit automat in
# ACELASI repo — vezi pasul final "Publica automat pe release + bump
# update.json". Necesita secretul RELEASE_PAT (fine-grained PAT, Contents:
# Read&Write, scopat DOAR la gordasgdc/gdc-plugin-manager) — fara el,
# pasul de publicare esueaza clar, restul build-ului (exe+installer)
# ramane neschimbat si tot descarcabil ca artefact.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    # `secrets` NU e un context permis direct intr-un `if:` de pas
    # (confirmat cu actionlint, validatorul real folosit de GitHub -
    # "context 'secrets' is not allowed here") - workflow-ul intreg ar
    # esua sa se valideze (0 joburi create), nu doar pasul respectiv.
    # Fix: valoarea trece printr-un `env:` la nivel de JOB (aici
    # `secrets` E permis), iar pasii citesc `env.HAS_WIN_SELFSIGN`
    # (context permis in `if:`). Vezi CLAUDE.md Regula 34 +
    # codesigning/README-windows.md.
    env:
      HAS_WIN_SELFSIGN: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 != '' }}

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza .NET SDK (8.0 pt. aplicatie, 9.0 pt. unealta de obfuscare)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # S1 (2026-09-25): clientul NU mai primeste niciun credential GitHub.
      # Descarcarile trec prin functia Supabase `authorize-download`; secretul
      # PRIVATE_CATALOG_TOKEN nu mai e folosit de acest workflow.

      # Contractele Core (autorizarea descarcarii, licenta). Fara pachete NuGet:
      # executabil cu asertiuni proprii; cod de iesire != 0 opreste build-ul.
      - name: TESTS — GDCPluginManager.Core
        run: dotnet run --project tests\GDCPluginManager.Core.Tests -c Release

      - name: Publica exe-ul self-contained (win-x64)
        # ATENTIE: fara -p:PublishSingleFile=true, intentionat. Obfuscarea de mai
        # jos rescrie GDCPluginManager.Core.dll ca fisier separat DUPA publish —
        # cu single-file, DLL-urile ar fi impachetate in interiorul exe-ului si
        # n-ar mai exista un fisier loose de inlocuit. installer.iss oricum
        # copiaza tot ce e in publish\ (Files: "publish\*"), deci trecerea la
        # multi-fisier nu cere nicio modificare acolo.
        run: |
          dotnet publish src\GDCPluginManager.Client -c Release -r win-x64 --self-contained -o publish

      # ─────────────────────────────────────────────────────────────────────
      # OBFUSCARE DEZACTIVATA PERMANENT (2026-08-25) — vezi CHANGELOG.md.
      # Obfuscar 3.0.0-beta.19 produce un DLL cu METADATA CORUPTA (tipuri
      # duplicate) de doua ori la rand, in doua configuratii diferite:
      #   1. Cu HidePrivateApi=true: "Duplicate type with name 'A'" — crash
      #      real la un client Windows viu, la pornire (MainWindow ->
      #      LicensePaneViewModel). Fix incercat: ReuseNames=false — a trecut
      #      smoke-test-ul simplu din CI, dar NU a rezolvat crash-ul real.
      #   2. Cu HidePrivateApi=false (doar HideStrings): "Duplicate type with
      #      name '<>c'" — clase generate de compilator (closures) tratate
      #      gresit la salvare. Confirma ca bug-ul e in Obfuscar insusi
      #      (metadata NestedClass), nu in setarile de renumire.
      # Concluzie: niciun DLL obfuscat cu acest tool nu poate fi garantat
      # corect. Corectitudinea conteaza mai mult decat obscurizarea —
      # Core.dll ramane NEOBFUSCAT pana se gaseste/verifica alt tool.
      # Smoke test-ul de mai jos ramane activ neschimbat, testand acum
      # direct DLL-ul din publish\ (deja identic cu ce ajunge la client).
      #
      # Smoke test: dovedeste ca API-ul PUBLIC al Core.dll inca
      # functioneaza EXACT ca inainte, apelat dintr-un binar separat — exact
      # cum face GDCPluginManager.exe. "Build-ul a reusit" nu e suficient:
      # KeepPublicApi=true e o SETARE, nu o garantie — asta chiar RULEAZA
      # DLL-ul obfuscat si verifica un rezultat cunoscut dinainte (calculat
      # independent, in Python, pe Mac — vezi valoarea asteptata mai jos).
      # Daca obfuscarea a rupt ceva, build-ul pica AICI, nu la un utilizator.
      - name: Smoke test — Core.dll raspunde corect
        shell: pwsh
        run: |
          $coreDll = (Resolve-Path "publish\GDCPluginManager.Core.dll").Path
          New-Item -ItemType Directory -Force -Path smoketest | Out-Null

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="BouncyCastle.Cryptography" Version="2.4.0" />
              <Reference Include="GDCPluginManager.Core">
                <HintPath>$coreDll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          "@ | Set-Content smoketest\SmokeTest.csproj

          @"
          using GDCPluginManager.Core.Services;
          using System;
          using System.Linq;

          // SHA-512("test-product-smoketest")[:4], calculat independent
          // (Python, hashlib) — NU regenerat aici, ca sa nu testam
          // "functia isi confirma singura rezultatul".
          var expected = new byte[] { 0x98, 0xfe, 0xe8, 0xc8 };
          var actual = LicenseCore.ProductHash("test-product-smoketest");
          if (!actual.SequenceEqual(expected))
              throw new Exception(`$"ProductHash gresit: asteptat {Convert.ToHexString(expected)}, primit {Convert.ToHexString(actual)}");

          // Round-trip Base32 (RFC 4648) — functie separata, alt fragment de cod.
          var original = new byte[] { 1, 2, 3, 4, 5, 250 };
          var encoded = LicenseCore.Base32Encode(original);
          var decoded = LicenseCore.Base32Decode(encoded);
          if (decoded is null || !decoded.SequenceEqual(original))
              throw new Exception("Base32 round-trip esuat dupa obfuscare");

          Console.WriteLine("Smoke test OK: Core.dll obfuscat raspunde corect la API-ul public.");
          "@ | Set-Content smoketest\Program.cs

          dotnet run --project smoketest -c Release

      # [CLAUDE.md Regula 34, 2026-09-06] Semnare Self-Signed, DOAR pentru
      # testare interna/cerc restrans (NU elimina SmartScreen pentru
      # publicul larg - vezi codesigning/README-windows.md). Ruleaza DOAR
      # daca secretele exista (Cristi le incarca o singura data, direct de
      # pe Windows real - certificatul nu trece niciodata prin conversatia
      # cu Claude) - altfel build-ul continua NESEMNAT, exact ca inainte,
      # fara nicio eroare (acelasi tipar ca semnarea Mac,
      # APPLE_SIGN_IDENTITY_APP).
      # S1: fisierele publicate NU contin credentiale (ASCII si UTF-16, cum stau
      # literalele .NET). Valorile nu se afiseaza; orice potrivire opreste build-ul.
      - name: SECURITY — fara credentiale in publish
        shell: pwsh
        run: |
          $pattern = 'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY|service_role'
          $bad = 0
          Get-ChildItem publish -Recurse -File | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $texts = @([System.Text.Encoding]::ASCII.GetString($bytes), [System.Text.Encoding]::Unicode.GetString($bytes))
            if ($bytes.Length -gt 1) { $texts += [System.Text.Encoding]::Unicode.GetString($bytes, 1, $bytes.Length - 1) }
            foreach ($t in $texts) { if ($t -match $pattern) { Write-Host "CREDENTIAL in $($_.Name)"; $bad = 1; break } }
          }
          if ($bad) { exit 1 } else { Write-Host "fara credentiale in publish" }

      - name: Semneaza GDCPluginManager.exe (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "publish\GDCPluginManager.exe"

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Semneaza installer-ul final (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\codesigning\sign-windows.ps1 -TargetPath "Output\GDCPluginManagerSetup.exe"

      - name: TESTS — SelfUpdater accepta instalatorul semnat (si refuza copia alterata)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        env:
          GDC_SIGNED_EXE: ${{ github.workspace }}\Output\GDCPluginManagerSetup.exe
        run: dotnet run --project tests\GDCPluginManager.Core.Tests -c Release

      - name: Incarca instalatorul ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: GDCPluginManager-Windows-Installer
          path: Output\GDCPluginManagerSetup.exe

      # Publicare automata (2026-09-05). Doar pe push la main (nu la un
      # "Run workflow" manual de test) - un dispatch manual de test nu
      # trebuie sa poata publica singur un release real neasteptat.
      # RELEASE_PAT e un fine-grained PAT scopat DOAR la
      # gordasgdc/gdc-plugin-manager, Contents: Read&Write - suficient
      # pentru "gh release upload/create" SI pentru commit+push pe
      # docs/update.json din acelasi repo (nu are acces la niciun alt
      # repo). Regula 29 (zero info interna in locuri publice): notele de
      # release/textul din update.json raman generice, fara nume proprii
      # sau detalii de debugging - jurnalul complet ramane in CHANGELOG.md
      # din acest repo.
      - name: Publica automat pe release + bump update.json (doar push pe main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path installer.iss -Pattern '#define MyAppVersion "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Versiune detectata: $version"

          $exeVersioned = "GDCPluginManagerSetup-$version.exe"
          Copy-Item "Output\GDCPluginManagerSetup.exe" $exeVersioned
          Compress-Archive -Path $exeVersioned -DestinationPath "GDCPluginManager-Windows.zip" -Force

          $tag = "v$version"
          $releaseRepo = "gordasgdc/gdc-plugin-manager"

          $exists = $true
          gh release view $tag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if (-not $exists) {
            Write-Host "Release $tag nu exista inca pe $releaseRepo - il creez (doar cu asset-ul Windows; Mac isi adauga separat pachetul semnat)."
            gh release create $tag --repo $releaseRepo --title $tag --notes "Actualizare Windows." --latest=false
          }

          gh release upload $tag "GDCPluginManager-Windows.zip" --repo $releaseRepo --clobber

          git clone "https://x-access-token:$env:GH_TOKEN@github.com/$releaseRepo.git" release-repo
          Push-Location release-repo
          $updateJson = Get-Content "docs\update.json" -Raw | ConvertFrom-Json
          # Link VERSIONAT: releases/latest arata spre ultimul release Mac (Windows e --latest=false) -> 404.
          $zipUrl = "https://github.com/$releaseRepo/releases/download/$tag/GDCPluginManager-Windows.zip"
          $zipSha = (Get-FileHash "..\GDCPluginManager-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $updateJson.windows.version = $version
          $updateJson.windows.release_date = (Get-Date -Format "yyyy-MM-dd")
          $updateJson.windows.changes = "Actualizare Windows, sincronizata cu ultima versiune."
          $updateJson.windows.download_url = $zipUrl
          $updateJson.windows | Add-Member -NotePropertyName sha256 -NotePropertyValue $zipSha -Force
          $updateJson.download_url.windows = $zipUrl
          # Regula 35: campul de la radacina (clienti <= 1.27) = MINIMUL dintre platforme.
          $minVersion = @([version]$updateJson.mac.version, [version]$version) | Sort-Object | Select-Object -First 1
          $updateJson.version = $minVersion.ToString()
          Write-Host "update.json: windows $version, sha256 $zipSha, radacina $($updateJson.version)"
          $updateJson | ConvertTo-Json -Depth 10 | Set-Content "docs\update.json"
          git config user.name "gdc-plugin-manager-win-ci"
          git config user.email "ci@gordas.dev"
          git add docs/update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Windows CI: update.json -> $version"
            git push
          } else {
            Write-Host "update.json deja la $version - nimic de comis."
          }
          Pop-Location
          Remove-Item -Recurse -Force release-repo
