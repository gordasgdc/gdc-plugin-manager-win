name: Build GDC Plugin Manager (Windows .exe + installer)

# Se ruleaza automat cand faci "git push" pe branch-ul main, sau manual
# din tab-ul "Actions" al repo-ului (butonul "Run workflow"). Rezultatul
# (GDCPluginManagerSetup.exe) e apoi urcat MANUAL pe release-ul de la
# gordasgdc/gdc-plugin-manager (acolo unde traiesc si asset-urile Mac),
# nu exista un release propriu-zis pe acest repo.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza .NET SDK (8.0 pt. aplicatie, 9.0 pt. unealta de obfuscare)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # PrivateCatalogAuth.cs e gitignored (contine tokenul GitHub real
      # pt. repo-ul privat gdc-plugin-manager-files) - CI il recreeaza
      # din sablon + secretul PRIVATE_CATALOG_TOKEN (Settings -> Secrets
      # and variables -> Actions, pe acest repo). Fara el, build-ul pica
      # cu "cannot find PrivateCatalogAuth in scope" (vezi
      # PrivateCatalogAuth.cs.example pentru cum se seteaza manual local).
      - name: Recreeaza PrivateCatalogAuth.cs din secret
        shell: pwsh
        run: |
          $template = Get-Content "src\GDCPluginManager.Core\Services\PrivateCatalogAuth.cs.example" -Raw
          $real = $template -replace 'PASTE_TOKEN_HERE', '${{ secrets.PRIVATE_CATALOG_TOKEN }}'
          Set-Content -Path "src\GDCPluginManager.Core\Services\PrivateCatalogAuth.cs" -Value $real -NoNewline

      - name: Publica exe-ul self-contained (win-x64)
        # ATENTIE: fara -p:PublishSingleFile=true, intentionat. Obfuscarea de mai
        # jos rescrie GDCPluginManager.Core.dll ca fisier separat DUPA publish —
        # cu single-file, DLL-urile ar fi impachetate in interiorul exe-ului si
        # n-ar mai exista un fisier loose de inlocuit. installer.iss oricum
        # copiaza tot ce e in publish\ (Files: "publish\*"), deci trecerea la
        # multi-fisier nu cere nicio modificare acolo.
        run: |
          dotnet publish src\GDCPluginManager.Client -c Release -r win-x64 --self-contained -o publish

      # ─────────────────────────────────────────────────────────────────────
      # OBFUSCARE DEZACTIVATA PERMANENT (2026-08-25) — vezi CHANGELOG.md.
      # Obfuscar 3.0.0-beta.19 produce un DLL cu METADATA CORUPTA (tipuri
      # duplicate) de doua ori la rand, in doua configuratii diferite:
      #   1. Cu HidePrivateApi=true: "Duplicate type with name 'A'" — crash
      #      real la un client Windows viu, la pornire (MainWindow ->
      #      LicensePaneViewModel). Fix incercat: ReuseNames=false — a trecut
      #      smoke-test-ul simplu din CI, dar NU a rezolvat crash-ul real.
      #   2. Cu HidePrivateApi=false (doar HideStrings): "Duplicate type with
      #      name '<>c'" — clase generate de compilator (closures) tratate
      #      gresit la salvare. Confirma ca bug-ul e in Obfuscar insusi
      #      (metadata NestedClass), nu in setarile de renumire.
      # Concluzie: niciun DLL obfuscat cu acest tool nu poate fi garantat
      # corect. Corectitudinea conteaza mai mult decat obscurizarea —
      # Core.dll ramane NEOBFUSCAT pana se gaseste/verifica alt tool.
      # Smoke test-ul de mai jos ramane activ neschimbat, testand acum
      # direct DLL-ul din publish\ (deja identic cu ce ajunge la client).
      #
      # Smoke test: dovedeste ca API-ul PUBLIC al Core.dll inca
      # functioneaza EXACT ca inainte, apelat dintr-un binar separat — exact
      # cum face GDCPluginManager.exe. "Build-ul a reusit" nu e suficient:
      # KeepPublicApi=true e o SETARE, nu o garantie — asta chiar RULEAZA
      # DLL-ul obfuscat si verifica un rezultat cunoscut dinainte (calculat
      # independent, in Python, pe Mac — vezi valoarea asteptata mai jos).
      # Daca obfuscarea a rupt ceva, build-ul pica AICI, nu la un utilizator.
      - name: Smoke test — Core.dll raspunde corect
        shell: pwsh
        run: |
          $coreDll = (Resolve-Path "publish\GDCPluginManager.Core.dll").Path
          New-Item -ItemType Directory -Force -Path smoketest | Out-Null

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="BouncyCastle.Cryptography" Version="2.4.0" />
              <Reference Include="GDCPluginManager.Core">
                <HintPath>$coreDll</HintPath>
              </Reference>
            </ItemGroup>
          </Project>
          "@ | Set-Content smoketest\SmokeTest.csproj

          @"
          using GDCPluginManager.Core.Services;
          using System;
          using System.Linq;

          // SHA-512("test-product-smoketest")[:4], calculat independent
          // (Python, hashlib) — NU regenerat aici, ca sa nu testam
          // "functia isi confirma singura rezultatul".
          var expected = new byte[] { 0x98, 0xfe, 0xe8, 0xc8 };
          var actual = LicenseCore.ProductHash("test-product-smoketest");
          if (!actual.SequenceEqual(expected))
              throw new Exception(`$"ProductHash gresit: asteptat {Convert.ToHexString(expected)}, primit {Convert.ToHexString(actual)}");

          // Round-trip Base32 (RFC 4648) — functie separata, alt fragment de cod.
          var original = new byte[] { 1, 2, 3, 4, 5, 250 };
          var encoded = LicenseCore.Base32Encode(original);
          var decoded = LicenseCore.Base32Decode(encoded);
          if (decoded is null || !decoded.SequenceEqual(original))
              throw new Exception("Base32 round-trip esuat dupa obfuscare");

          Console.WriteLine("Smoke test OK: Core.dll obfuscat raspunde corect la API-ul public.");
          "@ | Set-Content smoketest\Program.cs

          dotnet run --project smoketest -c Release

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Incarca instalatorul ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          name: GDCPluginManager-Windows-Installer
          path: Output\GDCPluginManagerSetup.exe
